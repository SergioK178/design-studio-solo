name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install site deps
        working-directory: site
        run: bun install --frozen-lockfile

      - name: Build site
        working-directory: site
        run: bun run build

      - name: Install API deps
        working-directory: api
        run: npm ci

      - name: Test API
        working-directory: api
        run: npm test

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/design-studio-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/design-studio-api:latest

      - name: Install SSH key
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload static release
        run: |
          set -euo pipefail
          RELEASE="${GITHUB_SHA}"
          SSH="ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          $SSH "mkdir -p /srv/3k-studio/releases/$RELEASE /srv/3k-studio/shared"
          rsync -az --delete -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes" site/dist/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/srv/3k-studio/releases/$RELEASE/"
          $SSH "ln -sfn /srv/3k-studio/releases/$RELEASE /srv/3k-studio/current && sudo systemctl reload caddy"

      # Gated: no live VPS is provisioned yet. Flip to `if: true` once
      # infra/DEPLOY.md's first-provision steps have run against a real host.
      - name: Deploy API image (gated — requires live VPS)
        if: false
        run: |
          set -euo pipefail
          SSH="ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          IMAGE="ghcr.io/${{ github.repository_owner }}/design-studio-api:${GITHUB_SHA}"
          $SSH "sed -i \"s#^Image=.*#Image=$IMAGE#\" ~/.config/containers/systemd/3k-api.container"
          $SSH "systemctl --user daemon-reload && systemctl --user restart 3k-api.service"

      - name: Healthcheck
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 3 "https://${{ secrets.DOMAIN }}/healthz"

      - name: Collect production metrics
        working-directory: site
        env:
          SITE_URL: https://${{ secrets.DOMAIN }}/
          METRICS_API_URL: https://${{ secrets.DOMAIN }}/api/metrics/runs
          METRICS_WRITE_TOKEN: ${{ secrets.METRICS_WRITE_TOKEN }}
          METRICS_SOURCE: deploy
          LIGHTHOUSE_BIN: npx lighthouse
        run: |
          set +e
          bun ../scripts/collect-metrics.ts
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning::metrics collection failed with exit code $status"
          fi
