document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

on:none\">Telegram ↗<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;max-width:640px;padding:90px 0\">\n      <h1 style=\"margin:0;font-family:Unbounded;font-weight:800;font-size:66px;line-height:1.08;letter-spacing:-.015em\">\n        Сайт под вашу задачу — <span style=\"color:#E5A43B\">за неделю.<\u002Fspan>\n      <\u002Fh1>\n      <p style=\"margin:26px 0 0;font-size:18px;line-height:1.5;max-width:420px;color:rgba(244,242,236,.7)\">\n        Каталоги, магазины, записи, парсеры. Цены открыты, от&nbsp;30&nbsp;000&nbsp;₽.\n      <\u002Fp>\n      <div style=\"display:flex;gap:14px;margin-top:36px\">\n        <a href=\"#brief\" style=\"background:#E5A43B;color:#17150F;padding:19px 28px;font-weight:600;font-size:15.5px;cursor:pointer;text-decoration:none\" style-hover=\"background:#F4F2EC\">Рассказать о задаче →<\u002Fa>\n        <a href=\"#brief\" style=\"border:1.5px solid rgba(244,242,236,.4);padding:17.5px 26px;font-weight:600;font-size:15.5px;cursor:pointer;color:rgba(244,242,236,.9);text-decoration:none\" style-hover=\"border-color:#F4F2EC\">Telegram<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"margin-top:40px;display:flex;gap:22px;font-size:13px;color:rgba(244,242,236,.6)\">\n        <span><b style=\"color:#F4F2EC\">900+ позиций<\u002Fb> перенесли<\u002Fspan>\n        <span><b style=\"color:#F4F2EC\">95 млн ₽<\u002Fb> объект продаём<\u002Fspan>\n        <span><b style=\"color:#F4F2EC\">трое<\u002Fb> отвечают лично<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ================= КЕЙСЫ ================= -->\n<div id=\"cases\" data-screen-label=\"Кейсы\" style=\"background:#F4F2EC;color:#17150F\">\n  <div style=\"max-width:1240px;margin:0 auto;box-sizing:border-box;padding:90px 48px 100px\">\n    <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:30px;margin-bottom:54px\">\n      <h2 style=\"margin:0;font-family:Unbounded;font-weight:700;font-size:44px;letter-spacing:-.01em\">Что уже сделали<\u002Fh2>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;color:rgba(23,21,15,.5)\">ИМЁН КЛИЕНТОВ НЕ НАЗЫВАЕМ — ПО ДОГОВОРУ<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:7fr 5fr;gap:22px;align-items:start\">\n      <div style=\"display:flex;flex-direction:column;gap:22px\">\n\n        <div style=\"background:#2743E0;color:#F4F2EC;padding:38px;min-height:360px;display:flex;flex-direction:column;cursor:pointer\" style-hover=\"background:#1F35B8\">\n          <div style=\"display:flex;justify-content:space-between;gap:16px;font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.1em;color:rgba(244,242,236,.75)\">\n            <span>B2B-ДИСТРИБЬЮТОР МЕДПРОДУКЦИИ<\u002Fspan><span>3 НЕДЕЛИ<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"margin-top:auto;padding-top:36px\">\n            <div style=\"font-family:Unbounded;font-weight:800;font-size:76px;line-height:1;letter-spacing:-.02em\">900+<\u002Fdiv>\n            <div style=\"font-family:Unbounded;font-weight:700;font-size:24px;line-height:1.3;margin-top:14px;max-width:480px\">позиций переехали со&nbsp;старого сайта — каталогом управляет обычный менеджер<\u002Fdiv>\n            <p style=\"margin:16px 0 0;font-size:14px;line-height:1.55;max-width:460px;color:rgba(244,242,236,.75)\">Спарсили и&nbsp;очистили старый каталог, перепроверили руками, загрузили в&nbsp;новую админку. Перенос данных оказался половиной проекта — и&nbsp;мы это умеем.<\u002Fp>\n            <div style=\"display:flex;gap:8px;margin-top:22px;flex-wrap:wrap\">\n              <span style=\"border:1px solid rgba(244,242,236,.45);padding:6px 11px;font-size:11.5px\">Каталог<\u002Fspan>\n              <span style=\"border:1px solid rgba(244,242,236,.45);padding:6px 11px;font-size:11.5px\">Перенос данных<\u002Fspan>\n              <span style=\"border:1px solid rgba(244,242,236,.45);padding:6px 11px;font-size:11.5px\">Админка<\u002Fspan>\n              <span style=\"margin-left:auto;font-size:13px;font-weight:600\">Разбор →<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#F4F2EC;color:#17150F;border:2px solid #17150F;padding:38px;min-height:240px;display:flex;flex-direction:column;cursor:pointer\" style-hover=\"box-shadow:10px 10px 0 #E5A43B;transform:translate(-3px,-3px);transition:all .18s ease\">\n          <div style=\"display:flex;justify-content:space-between;gap:16px;font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.1em;color:rgba(23,21,15,.55)\">\n            <span>МЕДОБОРУДОВАНИЕ · СВОЙ ПРОЕКТ<\u002Fspan><span>2 ДНЯ<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"margin-top:auto;padding-top:28px\">\n            <div style=\"font-family:Unbounded;font-weight:800;font-size:56px;line-height:1;letter-spacing:-.02em\">2 дня<\u002Fdiv>\n            <div style=\"font-family:Unbounded;font-weight:700;font-size:21px;line-height:1.3;margin-top:12px;max-width:440px\">лендинг для своего продукта — реальный темп без согласований<\u002Fdiv>\n            <div style=\"display:flex;gap:8px;margin-top:20px;flex-wrap:wrap\">\n              <span style=\"border:1px solid rgba(23,21,15,.35);padding:6px 11px;font-size:11.5px\">Лендинг<\u002Fspan>\n              <span style=\"border:1px solid rgba(23,21,15,.35);padding:6px 11px;font-size:11.5px\">Заявки + рассылка<\u002Fspan>\n              <span style=\"margin-left:auto;font-size:13px;font-weight:600;color:#2743E0\">Разбор →<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:22px\">\n\n        <div style=\"background:#C24A12;color:#F4F2EC;padding:38px;min-height:240px;display:flex;flex-direction:column;cursor:pointer\" style-hover=\"background:#A83D0C\">\n          <div style=\"display:flex;justify-content:space-between;gap:16px;font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.1em;color:rgba(244,242,236,.75)\">\n            <span>ПРОКАТ АВТО<\u002Fspan><span>1 НЕДЕЛЯ<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"margin-top:auto;padding-top:28px\">\n            <div style=\"font-family:Unbounded;font-weight:800;font-size:56px;line-height:1;letter-spacing:-.02em\">13 авто<\u002Fdiv>\n            <div style=\"font-family:Unbounded;font-weight:700;font-size:20px;line-height:1.3;margin-top:12px\">лендинг + CRM: заявки падают менеджеру в&nbsp;привычную систему<\u002Fdiv>\n            <div style=\"display:flex;gap:8px;margin-top:20px;flex-wrap:wrap\">\n              <span style=\"border:1px solid rgba(244,242,236,.45);padding:6px 11px;font-size:11.5px\">amoCRM<\u002Fspan>\n              <span style=\"border:1px solid rgba(244,242,236,.45);padding:6px 11px;font-size:11.5px\">Управление парком<\u002Fspan>\n              <span style=\"margin-left:auto;font-size:13px;font-weight:600\">Разбор →<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#17150F;color:#F4F2EC;padding:38px;min-height:360px;display:flex;flex-direction:column;cursor:pointer\" style-hover=\"background:#26231A\">\n          <div style=\"display:flex;justify-content:space-between;gap:16px;font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.1em;color:rgba(244,242,236,.6)\">\n            <span>ПРОДАЖА ГОСТЕВОГО ДОМА · 1082 м²<\u002Fspan><span>1 НЕДЕЛЯ<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"margin-top:auto;padding-top:36px\">\n            <div style=\"font-family:Unbounded;font-weight:800;font-size:64px;line-height:1;letter-spacing:-.02em;color:#E5A43B\">95 млн ₽<\u002Fdiv>\n            <div style=\"font-family:Unbounded;font-weight:700;font-size:21px;line-height:1.3;margin-top:14px\">объект с двумя режимами показа: инвестору и&nbsp;частному покупателю<\u002Fdiv>\n            <p style=\"margin:14px 0 0;font-size:14px;line-height:1.55;color:rgba(244,242,236,.65)\">Клиент не&nbsp;хотел выбирать позиционирование — сделали переключатель прямо на&nbsp;странице. Документы чипами, контакт сразу в&nbsp;мессенджер.<\u002Fp>\n            <div style=\"display:flex;gap:8px;margin-top:20px;flex-wrap:wrap\">\n              <span style=\"border:1px solid rgba(244,242,236,.35);padding:6px 11px;font-size:11.5px\">Два режима<\u002Fspan>\n              <span style=\"border:1px solid rgba(244,242,236,.35);padding:6px 11px;font-size:11.5px\">WhatsApp / TG<\u002Fspan>\n              <span style=\"margin-left:auto;font-size:13px;font-weight:600;color:#E5A43B\">Разбор →<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ================= ЦЕНЫ ================= -->\n<div id=\"prices\" data-screen-label=\"Цены\" style=\"background:#17150F;color:#F4F2EC\">\n  <div style=\"max-width:1240px;margin:0 auto;box-sizing:border-box;padding:90px 48px 100px\">\n    <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:30px;margin-bottom:14px\">\n      <h2 style=\"margin:0;font-family:Unbounded;font-weight:700;font-size:44px;letter-spacing:-.01em\">Цены — сразу<\u002Fh2>\n      <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.1em;color:#E5A43B\">БЕЗ «ОСТАВЬТЕ ЗАЯВКУ, МЫ ПЕРЕЗВОНИМ»<\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"margin:0 0 50px;font-size:16px;line-height:1.5;max-width:520px;color:rgba(244,242,236,.65)\">\n      В каждой цене — один круг правок. Пишем и&nbsp;что не&nbsp;входит: так у&nbsp;нас не&nbsp;бывает споров на&nbsp;сдаче.\n    <\u002Fp>\n    <div style=\"display:flex;flex-direction:column\">\n      <sc-for list=\"{{ products }}\" as=\"p\" hint-placeholder-count=\"4\">\n        <div style=\"padding:30px 0 34px;border-top:2px solid rgba(244,242,236,.25);cursor:pointer\" style-hover=\"border-top-color:#E5A43B\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:30px;flex-wrap:wrap\">\n            <span style=\"font-family:Unbounded;font-weight:800;font-size:52px;line-height:1.05;letter-spacing:-.02em\">{{ p.name }}<\u002Fspan>\n            <span style=\"font-family:Unbounded;font-weight:700;font-size:34px;color:#E5A43B;white-space:nowrap\">{{ p.price }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:170px 1fr 1fr;gap:30px;margin-top:18px;font-size:14px;line-height:1.55\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.06em;color:rgba(244,242,236,.5)\">{{ p.term }}<\u002Fspan>\n            <span style=\"color:rgba(244,242,236,.7)\">{{ p.desc }}<\u002Fspan>\n            <span style=\"color:rgba(244,242,236,.45)\"><b style=\"color:rgba(244,242,236,.7)\">Не входит:<\u002Fb> {{ p.excl }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div style=\"border-top:2px solid rgba(244,242,236,.25)\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:24px;margin-top:44px;flex-wrap:wrap\">\n      <a href=\"#brief\" style=\"background:#E5A43B;color:#17150F;padding:19px 28px;font-weight:600;font-size:15.5px;text-decoration:none\" style-hover=\"background:#F4F2EC\">Получить цену за 6 ответов →<\u002Fa>\n      <span style=\"font-size:13.5px;color:rgba(244,242,236,.55)\">Магазины, записи и нестандартное — оцениваем по задаче, вилку скажем в тот же день.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ================= ПРОЦЕСС ================= -->\n<div id=\"process\" data-screen-label=\"Процесс\" style=\"background:#F4F2EC;color:#17150F\">\n  <div style=\"max-width:1240px;margin:0 auto;box-sizing:border-box;padding:90px 48px 100px\">\n    <div style=\"display:grid;grid-template-columns:400px 1fr;gap:70px;align-items:start\">\n      <div style=\"position:sticky;top:40px\">\n        <h2 style=\"margin:0;font-family:Unbounded;font-weight:700;font-size:44px;line-height:1.15;letter-spacing:-.01em\">Ни одного созвона<\u002Fh2>\n        <p style=\"margin:22px 0 0;font-size:16px;line-height:1.55;color:rgba(23,21,15,.72)\">\n          Весь проект живёт в&nbsp;одном чате: вопросы, макеты, превью-ссылки, правки. Вы&nbsp;отвечаете, когда удобно, — мы&nbsp;не&nbsp;тратим ваши часы на&nbsp;встречи, поэтому дешевле.\n        <\u002Fp>\n        <p style=\"margin:16px 0 0;font-size:14px;line-height:1.55;color:rgba(23,21,15,.55)\">\n          Хочется голосом — окей, один созвон на&nbsp;старте. Но&nbsp;он правда не&nbsp;обязателен.\n        <\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:14px\">\n        <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"5\">\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.08em;color:rgba(23,21,15,.5);padding-left:2px\">{{ s.time }}<\u002Fspan>\n            <div style=\"align-self:flex-start;max-width:560px;background:{{ s.bg }};color:{{ s.fg }};border:{{ s.border }};padding:18px 22px\">\n              <b style=\"font-size:16.5px\">{{ s.name }}<\u002Fb>\n              <span style=\"display:block;font-size:14px;line-height:1.55;margin-top:6px;opacity:.78\">{{ s.desc }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"display:flex;flex-direction:column;gap:6px\">\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px;letter-spacing:.08em;color:rgba(23,21,15,.5);padding-left:2px\">ВЫ · В ЛЮБОЙ МОМЕНТ<\u002Fspan>\n          <div style=\"align-self:flex-end;max-width:420px;background:#17150F;color:#F4F2EC;padding:18px 22px\">\n            <span style=\"font-size:14.5px;line-height:1.55\">«Посмотрел превью с телефона, правки пришлю списком к вечеру» — и&nbsp;это весь ваш менеджмент проекта.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ================= КОМАНДА ================= -->\n<div id=\"team\" data-screen-label=\"Команда\" style=\"background:#17150F;color:#F4F2EC\">\n  <div style=\"max-width:1240px;margin:0 auto;box-sizing:border-box;padding:90px 48px 100px\">\n    <h2 style=\"margin:0 0 14px;font-family:Unbounded;font-weight:700;font-size:44px;letter-spacing:-.01em\">Трое. Лично.<\u002Fh2>\n    <p style=\"margin:0 0 50px;font-size:16px;line-height:1.5;max-width:520px;color:rgba(244,242,236,.65)\">\n      Стратегия, дизайн и&nbsp;инженерия — без менеджеров-посредников. В&nbsp;чате отвечает тот, кто делает.\n    <\u002Fp>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;border-top:2px solid rgba(244,242,236,.25)\">\n      <sc-for list=\"{{ team }}\" as=\"t\" hint-placeholder-count=\"3\">\n        <div style=\"padding:34px 34px 34px 0;margin-right:34px;border-right:{{ t.rule }};display:flex;flex-direction:column;gap:16px\">\n          <div style=\"width:120px;height:120px;border-radius:50%;border:1.5px solid rgba(244,242,236,.4);background:repeating-linear-gradient(-45deg,rgba(244,242,236,.16),rgba(244,242,236,.16) 5px,transparent 5px,transparent 10px);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.08em;color:rgba(244,242,236,.5)\">ФОТО<\u002Fdiv>\n          <div>\n            <div style=\"font-family:Unbounded;font-weight:800;font-size:32px;letter-spacing:-.01em\">{{ t.name }}<\u002Fdiv>\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#E5A43B;margin-top:8px\">{{ t.role }}<\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:14px;line-height:1.6;color:rgba(244,242,236,.68)\">{{ t.fact }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ================= CTA + FOOTER ================= -->\n<div id=\"brief\" data-screen-label=\"CTA и футер\" style=\"background:#E5A43B;color:#17150F\">\n  <div style=\"max-width:1240px;margin:0 auto;box-sizing:border-box;padding:90px 48px 80px\">\n    <div style=\"display:grid;grid-template-columns:1fr auto;gap:50px;align-items:center\">\n      <div>\n        <h2 style=\"margin:0;font-family:Unbounded;font-weight:800;font-size:52px;line-height:1.1;letter-spacing:-.015em;max-width:640px\">6 вопросов — и&nbsp;вы видите цену и&nbsp;срок. Без звонка.<\u002Fh2>\n        <p style=\"margin:20px 0 0;font-size:16px;line-height:1.5;max-width:460px;color:rgba(23,21,15,.75)\">\n          Бриф занимает три минуты. Вилка — ориентир, не&nbsp;оферта: точную цену зафиксируем в&nbsp;договоре.\n        <\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:14px;flex:none\">\n        <span style=\"background:#17150F;color:#F4F2EC;padding:22px 36px;font-weight:600;font-size:17px;cursor:pointer;text-align:center\" style-hover=\"background:#F4F2EC;color:#17150F\">Заполнить бриф →<\u002Fspan>\n        <span style=\"border:2px solid #17150F;padding:20px 34px;font-weight:600;font-size:17px;cursor:pointer;text-align:center\" style-hover=\"background:#17150F;color:#E5A43B\">Без формы: @camicie_nere<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"border-top:2px solid #17150F;overflow:hidden\">\n    <div style=\"display:flex;width:max-content;animation:tickerMove 28s linear infinite\">\n      <div style=\"display:flex;align-items:center;gap:26px;padding:14px 13px 14px 26px;font-family:Unbounded;font-weight:500;font-size:14px;letter-spacing:.05em;white-space:nowrap\">\n        <span>ЛЕНДИНГ<\u002Fspan><span>✳<\u002Fspan><span>КАТАЛОГ B2B<\u002Fspan><span>✳<\u002Fspan><span>МАГАЗИН<\u002Fspan><span>✳<\u002Fspan><span>ЗАПИСЬ ОНЛАЙН<\u002Fspan><span>✳<\u002Fspan><span>ВИТРИНА<\u002Fspan><span>✳<\u002Fspan><span>ПАРСЕР<\u002Fspan><span>✳<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:26px;padding:14px 26px 14px 13px;font-family:Unbounded;font-weight:500;font-size:14px;letter-spacing:.05em;white-space:nowrap\">\n        <span>ЛЕНДИНГ<\u002Fspan><span>✳<\u002Fspan><span>КАТАЛОГ B2B<\u002Fspan><span>✳<\u002Fspan><span>МАГАЗИН<\u002Fspan><span>✳<\u002Fspan><span>ЗАПИСЬ ОНЛАЙН<\u002Fspan><span>✳<\u002Fspan><span>ВИТРИНА<\u002Fspan><span>✳<\u002Fspan><span>ПАРСЕР<\u002Fspan><span>✳<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"background:#17150F;color:rgba(244,242,236,.55)\">\n    <div style=\"max-width:1240px;margin:0 auto;box-sizing:border-box;padding:26px 48px;display:flex;justify-content:space-between;gap:24px;font-size:12.5px;flex-wrap:wrap\">\n      <span style=\"font-family:Unbounded;font-weight:700;color:#F4F2EC;font-size:13px\">3K&nbsp;Studio<span style=\"color:#E5A43B\">.<\u002Fspan><\u002Fspan>\n      <span>Договор · оплата по этапам · самозанятость (НПД)<\u002Fspan>\n      <span>Политика ПД · Оферта · @camicie_nere<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;wallVisible&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Hero&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const mk = (logo, accent, nav, title, cta) => ({\n      logo, accent, nav, title, cta,\n      stripe: 'repeating-linear-gradient(-45deg,' + accent + '30,' + accent + '30 6px,' + accent + '10 6px,' + accent + '10 12px)'\n    });\n    const a = [\n      mk('РЕНТА', '#C24A12', 'Парк · Цены', 'Авто на выходные — от 2 900 ₽', 'Забронировать'),\n      mk('Клиника Север', '#0F8A80', 'Врачи · Приём', 'Запись к врачу — онлайн', 'Записаться'),\n      mk('СНАБ+', '#2743E0', 'Каталог · Опт', 'Каталог 900+ позиций с остатками', 'Скачать прайс')\n    ];\n    const b = [\n      mk('КОФЕ РЯДОМ', '#7A4A2B', 'Меню · Оптом', 'Зерно свежей обжарки — доставка', 'Заказать'),\n      mk('КВАРТАЛ', '#5A6E2B', 'Проекты · Ипотека', 'Дома готовы — ключи в этом году', 'Выбрать дом'),\n      mk('ДЕНТА', '#0F6E8A', 'Услуги · Цены', 'Приём в день обращения', 'Записаться')\n    ];\n    return {\n      wallVisible: this.props.wallVisible ?? true,\n      wallColA: [...a, ...a],\n      wallColB: [...b, ...b],\n      cases: [\n        {\n          tag: 'B2B-ДИСТРИБЬЮТОР МЕДПРОДУКЦИИ', term: '3 НЕДЕЛИ',\n          headline: 'Каталог на 900+ позиций — переехал со старого сайта целиком',\n          body: 'Спарсили и очистили старый каталог, перепроверили руками, загрузили в новую админку. Товарами теперь управляет обычный менеджер — без программиста.',\n          honest: 'требования были размытыми — сначала неделя вопросов, потом код. Перенос данных с олдскульного сайта оказался половиной проекта.'\n        },\n        {\n          tag: 'ПРОКАТ АВТОМОБИЛЕЙ', term: '1 НЕДЕЛЯ',\n          headline: '13 авто в аренде: лендинг + CRM, заявки падают менеджеру',\n          body: 'Лендинг, интеграция с amoCRM и системой управления парком. Клиент видит свободные машины, менеджер — заявки в привычной CRM.',\n          honest: 'CRM настраивали по документации, которую будто писали не для людей. Справились — теперь это наш конёк.'\n        },\n        {\n          tag: 'ПРОДАЖА ГОСТЕВОГО ДОМА · 1082 м²', term: '1 НЕДЕЛЯ',\n          headline: 'Объект на 95 млн ₽ — сайт с двумя режимами показа',\n          body: 'Покупатель-инвестор и частный покупатель видят разные акценты — переключатель прямо на странице. Документы — чипами, контакт — сразу в WhatsApp/Telegram.',\n          honest: 'клиент не хотел выбирать позиционирование. Мы не стали спорить — сделали оба, это оказалось лучшим решением.'\n        },\n        {\n          tag: 'МЕДОБОРУДОВАНИЕ · СВОЙ ПРОЕКТ', term: '2 ДНЯ',\n          headline: 'Лендинг за два дня — наша скорость, когда продукт свой',\n          body: 'Страница шовного материала: сбор заявок и рассылка пробных образцов. Показывает реальный темп конвейера без согласований.',\n          honest: 'самое сложное — не код, а позиционирование: чем один шовный материал лучше другого.'\n        }\n      ],\n      products: [\n        { name: 'Стартовый лендинг', term: '5 РАБОЧИХ ДНЕЙ', price: '30 000 ₽ фикс',\n          desc: 'Одна страница по типовой структуре, форма заявки, один круг правок сводным списком. 100% предоплата; срок идёт от сдачи контента.',\n          excl: 'вторая страница, интеграции, кастомная графика. Нужно больше — следующий тариф.' },\n        { name: 'Лендинг + CRM под ключ', term: '1–2 НЕДЕЛИ', price: '60–150 тыс ₽',\n          desc: 'Страница + заявки прямо в вашу CRM (или поставим новую), аналитика, обучение менеджера.',\n          excl: 'каталог товаров и личные кабинеты.' },\n        { name: 'Каталог для B2B', term: '2–4 НЕДЕЛИ', price: '150–350 тыс ₽',\n          desc: 'Сотни-тысячи позиций, перенос данных со старого сайта, админка, которой управляет менеджер, прайс на скачивание.',\n          excl: 'онлайн-оплата и складской учёт — это уже магазин, оцениваем отдельно.' },\n        { name: 'Парсеры и автоматизация', term: 'ПО ЗАДАЧЕ', price: 'от 30 000 ₽',\n          desc: 'Собрать данные конкурентов, перенести каталог, автоматизировать рутину с таблицами.',\n          excl: 'поддержка по подписке — обсуждается отдельно.' }\n      ],\n      steps: [\n        { time: 'ДЕНЬ 0 · 3 МИНУТЫ', name: 'Бриф — 6 вопросов', desc: 'Отвечаете языком бизнеса: «нужен каталог», «нужна страница, собирающая заявки». Вилка цены и срока — сразу на экране.' },\n        { time: 'ДЕНЬ 1', name: 'Оценка и договор', desc: 'Фиксируем скоуп, цену и срок письменно. Оплата по этапам.' },\n        { time: 'ДНИ 2–5', name: 'Дизайн', desc: 'Присылаем в чат живую ссылку, а не картинку: можно кликать с телефона.' },\n        { time: 'ДНИ 3–12', name: 'Сборка', desc: 'Превью обновляется по мере работы — вы видите прогресс без статус-встреч.' },\n        { time: 'ФИНАЛ · 1–3 ДНЯ', name: 'Правки и запуск', desc: 'Один круг правок сводным списком — входит в цену. Потом домен, метрика, передача доступов.' }\n      ].map(s => ({ ...s, bg: '#FFFFFF', fg: '#17150F', border: '1.5px solid rgba(23,21,15,.25)' })),\n      team: [\n        { name: 'Сергей', role: 'СТРАТЕГИЯ · АРХИТЕКТУРА · КОД', fact: 'ВШМ СПбГУ, стратегия и консалтинг. Считал финмодели проектов до 16,7 млн ₽ — поэтому бриф выдаёт цену мгновенно.' },\n        { name: 'Ульяна', role: 'ДИЗАЙН · АЙДЕНТИКА', fact: 'Архитектор (СПбГАСУ): проектирует жилые дома и свёрстанный вручную каталог на 154 страницы. Планировки в наших кейсах — настоящие.' },\n        { name: 'Фёдор', role: 'ПРОДАЖИ · ПРОДУКТ · КОД', fact: '150–200 клиентских встреч в месяц в банке — знает, как звучит задача бизнеса, до того как она станет ТЗ.' }\n      ].map((t, i) => ({ ...t, rule: i < 2 ? '1.5px solid rgba(244,242,236,.25)' : 'none' }))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
</html>
